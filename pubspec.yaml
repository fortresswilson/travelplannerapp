name: travelplannerapp
description: TropicaGuide - Collaborative Travel Planner
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase core ─────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.0.0

  # ─── Google Sign-In ────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ─── Image picker (for profile/activity photos) ────────────────
  image_picker: ^1.1.2

  # ─── UI utilities ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
